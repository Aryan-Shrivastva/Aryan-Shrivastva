# GitHub Action for generating LeetCode stats & contribution snake animation
# Fetches your LeetCode submission data and generates animated SVGs automatically

name: Generate LeetCode Snake & Stats

on:
  # Run automatically every 2 hours
  schedule:
    - cron: "0 */2 * * *"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

  # Run on every push to main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate LeetCode Snake & Stats
        run: node scripts/generate-snake.js
        env:
          LEETCODE_USERNAME: AryannnnnnShrivastva

      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Update LeetCode Stats & Snake"
          add: "dist/*"

